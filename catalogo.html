<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Eva Spa</title>
  <meta name="description" content="Catálogo de esmaltes y productos disponibles." />
  <link rel="stylesheet" href="shared/css/tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-hero {
      padding: calc(var(--nav-h) + 3.5rem) clamp(1.25rem,5vw,3rem) 3rem;
      text-align: center;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(251,207,232,0.45) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 20% 80%, rgba(253,230,138,0.35) 0%, transparent 55%),
        var(--bg);
    }
    .page-hero .eyebrow { margin-bottom: .6rem; }
    .page-hero h1 { margin-bottom: .75rem; }
    .page-hero p {
      color: var(--text-muted);
      max-width: 460px;
      margin: 0 auto;
      font-size: .95rem;
    }

    /* Filtros */
    .filtros-bar {
      max-width: 1160px;
      margin: 2.5rem auto 0;
      padding: 0 clamp(1.25rem,5vw,3rem);
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-wrap: wrap;
    }
    .filtro-chip {
      padding: .4rem 1rem;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: .8rem;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
    }
    .filtro-chip:hover { border-color: var(--accent); color: var(--accent); }
    .filtro-chip.active {
      background: var(--bg-yellow);
      border-color: var(--gold);
      color: var(--text);
      font-weight: 500;
    }
    .buscar-wrap {
      margin-left: auto;
      position: relative;
    }
    .buscar-wrap input {
      padding: .45rem 1rem .45rem 2.2rem;
      border-radius: 50px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .82rem;
      outline: none;
      width: 200px;
      transition: border-color .2s, width .3s;
    }
    .buscar-wrap input:focus {
      border-color: var(--accent);
      width: 240px;
    }
    .buscar-icon {
      position: absolute;
      left: .75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: .85rem;
      pointer-events: none;
    }

    /* Grid de productos */
    .productos-section {
      max-width: 1160px;
      margin: 0 auto;
      padding: 2rem clamp(1.25rem,5vw,3rem) 5rem;
    }
    .productos-count {
      font-size: .8rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    .productos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
    }
    @media (max-width: 540px) {
      .productos-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: .75rem;
      }
    }

    /* Card producto */
    .producto-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform .22s, box-shadow .22s;
    }
    .producto-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }
    .producto-foto {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      background: var(--bg-pink);
    }
    .producto-foto-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    .producto-body {
      padding: 1rem;
    }
    .producto-cat {
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: .3rem;
    }
    .producto-nombre {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: var(--text);
      margin-bottom: .2rem;
    }
    .producto-marca {
      font-size: .78rem;
      color: var(--text-muted);
      margin-bottom: .6rem;
    }
    .producto-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .7rem 1rem;
      border-top: 1px solid var(--border);
    }
    .producto-foto-wrap {
      position: relative;
    }
    .color-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.7);
      box-shadow: 0 1px 4px rgba(0,0,0,.18);
      display: inline-block;
      flex-shrink: 0;
    }
    .color-dot-overlay {
      position: absolute;
      bottom: 8px; right: 8px;
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.85);
      box-shadow: 0 1px 5px rgba(0,0,0,.22);
    }
    .stock-badge {
      font-size: .72rem;
      font-weight: 500;
      padding: .18rem .6rem;
      border-radius: 50px;
    }

    /* Skeleton loader */
    .skeleton-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .skeleton {
      background: linear-gradient(90deg,
        var(--border) 25%,
        var(--bg) 50%,
        var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .sk-img  { width: 100%; aspect-ratio: 1; }
    .sk-line { height: 13px; margin: .85rem .85rem .4rem; border-radius: 6px; }
    .sk-line.short { width: 60%; }

    /* Estado vacío */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-state .empty-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
      opacity: .4;
    }

    @media (max-width: 600px) {
      .buscar-wrap { margin-left: 0; width: 100%; }
      .buscar-wrap input { width: 100%; }
      .buscar-wrap input:focus { width: 100%; }
    }
    @media (max-width: 540px) {
      .producto-footer { padding: .5rem .6rem; }
      .ver-mas-hint { font-size: .65rem; padding: .22rem .55rem; }
      .producto-body { padding: .6rem .6rem .3rem; }
      .producto-nombre { font-size: .92rem; }
      .producto-marca { font-size: .72rem; }
      .stock-badge { font-size: .65rem; padding: .14rem .45rem; }
    }
    /* ── Modal detalle producto ── */
    .detalle-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(61,32,32,.45);
      backdrop-filter: blur(4px);
      z-index: 900;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .detalle-overlay.open { display: flex; }
    .detalle-modal {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      width: 100%;
      max-width: 420px;
      max-height: 92vh;
      overflow: hidden;
      display: flex;
      flex-direction: row;
      position: relative;
    }
    /* En desktop: foto a la izquierda, info a la derecha */
    .detalle-foto-wrap {
      position: relative;
      width: 45%;
      flex-shrink: 0;
      background: var(--bg-pink);
    }
    .detalle-foto { width: 100%; height: 100%; object-fit: cover; display: block; }
    .detalle-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 4rem; opacity: .3; }
    .detalle-color-dot { position: absolute; bottom: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.9); box-shadow: 0 1px 5px rgba(0,0,0,.25); }
    .detalle-cerrar { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,.45); color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .detalle-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .detalle-body { padding: 1.1rem 1.1rem .4rem; flex: 1; }
    .detalle-cat { font-size: .65rem; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--gold); margin-bottom: .25rem; }
    .detalle-nombre { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; color: var(--text); margin-bottom: .1rem; line-height: 1.2; }
    .detalle-marca { font-size: .78rem; color: var(--text-muted); margin-bottom: .4rem; }
    .detalle-codigo { font-size: .72rem; color: var(--text-muted); background: var(--bg); border-radius: 6px; padding: .18rem .55rem; display: inline-block; margin-bottom: .5rem; }
    .detalle-footer { padding: .75rem 1.1rem 1.1rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: .65rem; }
    .cantidad-wrap { display: flex; align-items: center; gap: .65rem; }
    .cantidad-label { font-size: .78rem; color: var(--text-muted); }
    .cantidad-ctrl { display: flex; align-items: center; gap: .4rem; background: var(--bg); border: 1px solid var(--border); border-radius: 50px; padding: .15rem .4rem; }
    .cantidad-btn { background: none; border: none; color: var(--accent); font-size: 1.1rem; font-weight: 700; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .cantidad-btn:hover { background: var(--bg-pink); }
    .cantidad-num { min-width: 22px; text-align: center; font-weight: 600; font-size: .9rem; color: var(--text); }

    /* Móvil: layout vertical con foto recortada arriba */
    @media (max-width: 500px) {
      .detalle-overlay { padding: .75rem; }
      .detalle-modal {
        flex-direction: column;
        max-height: 88vh;
        max-width: 100%;
      }
      .detalle-foto-wrap {
        width: 100%;
        height: 38vh;
        flex-shrink: 0;
      }
      .detalle-body { padding: .85rem .9rem .3rem; }
      .detalle-nombre { font-size: 1.15rem; }
      .detalle-footer { padding: .6rem .9rem .9rem; gap: .55rem; }
    }
    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: .55rem 1.2rem;
      font-family: 'DM Sans', sans-serif;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s, transform .15s;
      width: 100%;
      justify-content: center;
    }
    .btn-whatsapp:hover { background: #1ebe5d; transform: translateY(-1px); }
    .btn-whatsapp svg { width: 15px; height: 15px; fill: #fff; flex-shrink: 0; }
    .ver-mas-hint {
      font-size: .72rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--bg-pink);
      border: 1px solid var(--accent);
      border-radius: 50px;
      padding: .28rem .75rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .producto-card:hover .ver-mas-hint {
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>

<div id="site-nav"></div>

<!-- Hero -->
<div class="page-hero">

    <div class="skeleton-card"><div class="skeleton sk-img"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line short"></div></div>

    <div class="skeleton-card"><div class="skeleton sk-img"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line short"></div></div>
    <div class="skeleton-card"><div class="skeleton sk-img"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line short"></div></div>

<!-- Modal detalle producto -->
<div class="detalle-overlay" id="detalleOverlay" onclick="cerrarDetalle(event)">
  <div class="detalle-modal" id="detalleModal">

      <div class="detalle-cat" id="detalleCat"></div>

    <div class="detalle-footer">

        <span class="cantidad-label">Cantidad:</span>
        <div class="cantidad-ctrl">
          <button class="cantidad-btn" onclick="cambiarCantidad(-1)">−</button>
          <span class="cantidad-num" id="cantidadNum">1</span>
          <button class="cantidad-btn" onclick="cambiarCantidad(1)">+</button>
        </div>
      </div>

        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.117.554 4.103 1.523 5.824L.057 23.882a.5.5 0 0 0 .61.637l6.265-1.643A11.94 11.94 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.797 9.797 0 0 1-5.001-1.374l-.358-.213-3.722.976.993-3.63-.233-.374A9.818 9.818 0 0 1 2.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>

<script>
let todosLosProductos = [];
let catActiva = '';

// ── Cargar productos ───────────────────────────────────────
async function cargarProductos() {
  try {
    // Intentar desde API primero
    const res  = await fetch(API_URL + '?action=getInventarioPublico');
    const json = await res.json();
    const data = json.data || [];
    todosLosProductos = data;
  } catch(e) {
    // Fallback a localStorage si la API falla
    todosLosProductos = getInventario().filter(p => p.visibilidad === 'publico');
  }

  construirFiltros();
  filtrar();
}

// ── Construir chips de categorías ──────────────────────────
function construirFiltros() {
  const cats = [...new Set(todosLosProductos.map(p => p.categoria).filter(Boolean))].sort();
  const bar  = document.getElementById('filtrosBar');
  // Quitar chips viejos excepto "Todos" y el buscador
  bar.querySelectorAll('.filtro-chip:not([data-cat=""])').forEach(el => el.remove());
  const buscar = bar.querySelector('.buscar-wrap');
  cats.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'filtro-chip';
    chip.dataset.cat = c;
    chip.textContent = c;
    chip.onclick = () => setCat(c);
    bar.insertBefore(chip, buscar);
  });
}

function setCat(cat) {
  catActiva = cat;
  document.querySelectorAll('.filtro-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.cat === cat);
  });
  filtrar();
}

// ── Filtrar y renderizar ───────────────────────────────────
function filtrar() {
  const q = (document.getElementById('buscarInput').value || '').toLowerCase();
  const lista = todosLosProductos.filter(p => {
    const matchCat = !catActiva || p.categoria === catActiva;
    const matchQ   = !q ||
      (p.nombre||'').toLowerCase().includes(q) ||
      (p.marca||'').toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  renderProductos(lista);
}

// ── Renderizar grid ────────────────────────────────────────
function renderProductos(lista) {
  const grid = document.getElementById('productosGrid');
  const count = document.getElementById('productosCount');

  count.textContent = lista.length
    ? `${lista.length} producto${lista.length !== 1 ? 's' : ''}`
    : '';

  if (!lista.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <span class="empty-icon">💅</span>
        <p>${todosLosProductos.length === 0
          ? 'Todavía no hay productos publicados.'
          : 'No encontramos productos con ese filtro.'}</p>
      </div>`;
    return;
  }

  grid.innerHTML = lista.map(p => {
    const stock = Number(p.stock) || Number(p.stock === 0 ? 0 : p.stock);
    let stockHtml = '';
    if (stock <= 0) {
      stockHtml = `<span class="stock-badge" style="background:rgba(239,68,68,.1);color:#dc2626">Sin stock</span>`;
    } else if (stock <= 2) {
      stockHtml = `<span class="stock-badge" style="background:rgba(245,158,11,.1);color:#b45309">Últimos</span>`;
    } else {
      stockHtml = `<span class="stock-badge" style="background:rgba(34,197,94,.1);color:#16a34a">Disponible</span>`;
    }

    const colorOverlay = p.color
      ? `<span class="color-dot-overlay" style="background:${p.color}" title="${p.color}"></span>`
      : '';

    const fotoHtml = p.fotoUrl
      ? `<div class="producto-foto-wrap">
           <img class="producto-foto" src="${p.fotoUrl}" alt="${p.nombre}" loading="lazy">
           ${colorOverlay}
         </div>`
      : `<div class="producto-foto-wrap">
           <div class="producto-foto-placeholder" style="background:${p.color || 'var(--bg-pink)'}">
             <span style="font-size:3rem;opacity:.3">💅</span>
           </div>
           ${colorOverlay}
         </div>`;

    return `
      <article class="producto-card reveal" onclick="abrirDetalle('${p.id}')" style="cursor:pointer">
        ${fotoHtml}
        <div class="producto-body">
          <div class="producto-cat">${p.categoria || ''}</div>
          <div class="producto-nombre">${p.nombre || '—'}</div>
          <div class="producto-marca">${p.marca || ''}</div>
        </div>
        <div class="producto-footer">
          ${stockHtml}
          <span class="ver-mas-hint">Ver detalle →</span>
        </div>
      </article>`;
  }).join('');

  // Activar animaciones en los nuevos elementos
  document.querySelectorAll('.reveal:not(.visible)').forEach(el => {
    revealObserver.observe(el);
  });
}

// ── Init ───────────────────────────────────────────────────
cargarProductos();

// ── Modal detalle ──────────────────────────────────────────
const WA_NUMBER = "5491163322427";
let productoActual = null;
let cantidadActual = 1;

function abrirDetalle(id) {
  const p = todosLosProductos.find(x => String(x.id) === String(id));
  if (!p) return;
  productoActual = p;
  cantidadActual = 1;
  document.getElementById("cantidadNum").textContent = 1;

  // Foto
  const wrap = document.getElementById("detalleFotoWrap");
  const viejasImg = wrap.querySelectorAll("img, .detalle-placeholder, .detalle-color-dot");
  viejasImg.forEach(el => el.remove());
  if (p.fotoUrl) {
    const img = document.createElement("img");
    img.className = "detalle-foto";
    img.src = p.fotoUrl;
    img.alt = p.nombre;
    wrap.appendChild(img);
  } else {
    const ph = document.createElement("div");
    ph.className = "detalle-placeholder";
    ph.textContent = "💅";
    wrap.appendChild(ph);
  }
  if (p.color) {
    const dot = document.createElement("span");
    dot.className = "detalle-color-dot";
    dot.style.background = p.color;
    wrap.appendChild(dot);
  }

  // Textos
  document.getElementById("detalleCat").textContent    = p.categoria || "";
  document.getElementById("detalleNombre").textContent = p.nombre    || "—";
  document.getElementById("detalleMarca").textContent  = p.marca     || "";
  document.getElementById("detalleCodigo").textContent = p.notas     ? "Cód: " + p.notas : "";
  const precioEl = document.getElementById("detallePrecio");
  if (p.precioVenta && p.precioVisible === "si") {
    precioEl.textContent = "$" + Number(p.precioVenta).toLocaleString("es-AR");
    precioEl.style.display = "block";
  } else {
    precioEl.style.display = "none";
  }

  document.getElementById("detalleOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function cerrarDetalleDirecto() {
  document.getElementById("detalleOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

function cerrarDetalle(e) {
  if (e.target === document.getElementById("detalleOverlay")) cerrarDetalleDirecto();
}

function cambiarCantidad(delta) {
  cantidadActual = Math.max(1, cantidadActual + delta);
  document.getElementById("cantidadNum").textContent = cantidadActual;
}

function consultarWhatsapp() {
  if (!productoActual) return;
  const p    = productoActual;
  const cod  = p.notas  || p.id  || "-";
  const nom  = p.nombre || "-";
  const cant = cantidadActual;
  const msg  = `Hola Gise! Me interesa este producto.\n\nCodigo: ${cod}\nNombre: ${nom}\nCantidad: ${cant}\n\nEsta disponible?`;
  window.open("https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(msg), "_blank");
}
</script>
